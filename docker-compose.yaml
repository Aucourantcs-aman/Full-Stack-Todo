# version: '3.8'
services:
  # MongoDB service
  # mongo:
  #   image: mongo:latest
  #   container_name: mern_mongo
  #   ports:
  #     - '27017:27017'
  #   volumes:
  #     - mongo_data:/data/db

  # Backend service (Node.js/Express)
  backend:
    build: ./backend # Path to your backend's Dockerfile
      # dockerfile: Dockerfile
    container_name: backend
    restart: always
    ports:
      - '3000:3000' # Map host port 5000 to container port 5000
    env_file:
      - ./backend/.env
    # depends_on:
    #   - mongo # Ensure MongoDB starts before the backend

  # Frontend service (React)
  frontend:
    build: ./client # Path to your frontend's Dockerfile
    args: 
      VITE_API_URL: http://98.92.123.46:3000/api
      # dockerfile: Dockerfile
    container_name: frontend
    restart: always
    ports:
      - '5173:5173' # Map host port 3000 to container port 3000
    env_file:
      - ./client/.env
    depends_on:
      - backend # Ensure backend starts before the frontend

# volumes:
#   mongo_data: # Define a named volume for persistent MongoDB data