# version: '3.8'  # Docker Compose file format version

services:
  # ---------------------------------------------
  # Backend Service (Node.js + Express)
  # ---------------------------------------------
  backend:
    build:
      context: ./backend         # Folder where the backend Dockerfile is located
      dockerfile: Dockerfile     # Specify the exact Dockerfile to use
    container_name: backend      # Name of the container for easy identification
    restart: always              # Automatically restart if the container stops
    ports:
      - "3000:3000"              # Expose backend on host port 3000 → container port 3000
    env_file:
      - ./backend/.env           # Load environment variables from this file inside the container

  # ---------------------------------------------
  # Frontend Service (React + Vite)
  # ---------------------------------------------
  frontend:
    build:
      context: ./client          # Folder where the frontend Dockerfile is located
      dockerfile: Dockerfile     # The Dockerfile used to build the React app
      args:
        # Build-time argument used inside the Dockerfile, injected into Vite build
        # VITE_API_URL: "http://localhost:3000"  
        # VITE_API_URL: "http://98.92.123.46:3000"  
        VITE_API_URL: "http://3.238.225.87:3000"  
    container_name: frontend     # Name of the container for readability
    restart: always              # Restart container automatically if it fails
    ports:
      - "5173:5173"              # Expose frontend on host port 5173 → container port 5173
    env_file:
      - ./client/.env            # Load environment variables for the frontend build/runtime
    depends_on:
      - backend                  # Ensures backend container starts before frontend
